name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            asset: yt-dlp_linux
          - target: x86_64-linux-musl
            asset: yt-dlp_musllinux
          - target: aarch64-linux-gnu
            asset: yt-dlp_linux_aarch64
          - target: aarch64-linux-musl
            asset: yt-dlp_musllinux_aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm pkg-config >/dev/null

      - name: Fetch engine payloads
        run: |
          tools/fetch_payloads.sh --asset "${{ matrix.asset }}" --out payload
          tools/make_ffmpeg.sh --target "${{ matrix.target }}" --out payload
          ls -la payload

      - name: Build
        run: zig build -Dtarget="${{ matrix.target }}" -Doptimize=ReleaseSmall --prefix dist

      - name: Size gate (<= 60 MiB)
        run: |
          size=$(stat -c%s dist/bin/reclipz)
          echo "reclipz size: $size bytes"
          test "$size" -le $((60 * 1024 * 1024))

      - name: Smoke test (native targets only)
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          ./dist/bin/reclipz version
          ./dist/bin/reclipz selftest
          zig build test -Dtarget="${{ matrix.target }}" -Doptimize=ReleaseSafe

      - name: Name artifact
        run: |
          mkdir -p out
          cp dist/bin/reclipz "out/reclipz-${{ matrix.target }}"
          cp LICENSE "out/LICENSE-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: reclipz-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum reclipz-* > SHA2-256SUMS
          cat SHA2-256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/reclipz-*
            artifacts/SHA2-256SUMS
